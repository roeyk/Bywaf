[plugin]
version = "0.12.2"
native = false
library_backed = false
process_wrapped = true
service = false
roles = ["command-provider"]

[[commandlets]]
name = "example_wrapped_tool"
description = "Example process-wrapped commandlet."
usage = "example_wrapped_tool <target>"
examples = [
  "example_wrapped_tool example.test",
]
emits = [
  "example.tool.result",
]
capabilities = [
  "artifact.write",
  "framework.process.run",
]

[[commandlets.arguments]]
name = "target"
description = "Target value passed to the external tool"
