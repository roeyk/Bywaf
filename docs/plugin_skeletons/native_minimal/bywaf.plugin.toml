[plugin]
version = "0.1.0"
native = true
library_backed = false
process_wrapped = false
service = false
roles = ["command-provider"]

[[commandlets]]
name = "example_minimal"
description = "Minimal example commandlet."
usage = "example_minimal <target>"
examples = [
  "example_minimal example.test",
]
emits = [
  "example.observed",
]
capabilities = [
  "framework.console.output",
]

[[commandlets.arguments]]
name = "target"
description = "Target value to process"
