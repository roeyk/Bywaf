[plugin]
version = "0.12.2"
native = true
service = false

[[commandlets]]
name = "report"
consumes = [
  "finding.candidate",
  "finding.confirmed",
  "finding.new",
  "finding.merge_candidate",
  "service.detected",
  "tcp.banner",
  "http.endpoint",
  "web.fingerprint",
]
emits = [
  "finding.candidate",
  "finding.new",
  "finding.duplicate",
  "finding.updated",
  "finding.merge_candidate",
  "report.rendered",
]
capabilities = [
  "db.read:*",
  "db.read:finding.new",
  "db.read:finding.candidate",
  "db.read:finding.confirmed",
  "db.read:finding.merge_candidate",
  "db.read:finding.reviewed",
  "db.read:host.found",
  "db.read:name.resolved",
  "db.read:port.open",
  "db.read:service.detected",
  "db.read:tcp.banner",
  "db.read:http.endpoint",
  "db.read:http.path",
  "db.read:tls.certificate",
  "db.read:web.fingerprint",
  "db.read:web.waf.detected",
  "db.read:web.screenshotted_host",
  "db.read:network.route.hop",
  "db.read:artifact.attached",
  "db.read:report.scope.saved",
  "db.write:*",
  "db.write:finding.candidate",
  "db.write:finding.new",
  "db.write:finding.duplicate",
  "db.write:finding.updated",
  "db.write:finding.merge_candidate",
  "db.write:report.scope.saved",
  "db.write:report.rendered",
  "db.write:finding.reviewed",
  "finding.review",
  "framework.console.output",
  "framework.file.page",
]
database.actions.view = true
database.actions.write = true
database.actions.manage = false
module = "bywaf.plugins.analysis.report"
