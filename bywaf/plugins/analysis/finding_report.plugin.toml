[plugin]
version = "0.12.2"
native = true
service = false

[[commandlets]]
name = "finding_report"
consumes = [
  "finding.candidate",
  "finding.confirmed",
  "finding.new",
  "finding.merge_candidate",
  "nikto.finding",
  "vulnerability.found",
  "vulnerability.potential",
  "vulnerability.confirmed",
  "vulnerability.speculative",
  "vulnerability.false_positive",
]
emits = [
  "framework.render.table.requested",
  "artifact.attached",
]
capabilities = [
  "artifact.write",
  "db.read:*",
  "db.read:finding.candidate",
  "db.read:finding.confirmed",
  "db.read:finding.new",
  "db.read:finding.merge_candidate",
  "db.read:nikto.finding",
  "db.read:vulnerability.found",
  "db.read:vulnerability.potential",
  "db.read:vulnerability.confirmed",
  "db.read:vulnerability.speculative",
  "db.read:vulnerability.false_positive",
  "filesystem.read",
  "filesystem.write",
  "framework.render.table",
]
module = "bywaf.plugins.analysis.finding_report"
