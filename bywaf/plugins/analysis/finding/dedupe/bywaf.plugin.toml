[plugin]
version = "0.13.0"
native = true
service = false

[[commandlets]]
name = "finding_dedupe"
consumes = [
  "finding.candidate",
  "finding.confirmed",
  "nikto.finding",
  "vulnerability.found",
  "vulnerability.potential",
  "vulnerability.confirmed",
  "vulnerability.speculative",
  "vulnerability.false_positive",
]
emits = [
  "finding.new",
  "finding.duplicate",
  "finding.updated",
  "finding.merge_candidate",
]
capabilities = [
  "artifact.write",
  "db.read:*",
  "db.read:finding.candidate",
  "db.read:finding.confirmed",
  "db.read:nikto.finding",
  "db.read:vulnerability.found",
  "db.read:vulnerability.potential",
  "db.read:vulnerability.confirmed",
  "db.read:vulnerability.speculative",
  "db.read:vulnerability.false_positive",
  "db.write:*",
  "db.write:finding.new",
  "db.write:finding.duplicate",
  "db.write:finding.updated",
  "db.write:finding.merge_candidate",
  "filesystem.read",
  "filesystem.write",
  "framework.console.alert",
  "framework.console.output",
]
module = "bywaf.plugins.analysis.finding.dedupe"
