[plugin]
version = "0.13.0"
native = true
service = false

[[commandlets]]
name = "finding"
consumes = [
  "finding.candidate",
  "finding.confirmed",
  "finding.new",
  "finding.merge_candidate",
]
emits = [
  "finding.reviewed",
]
capabilities = [
  "db.read:finding.new",
  "db.read:finding.candidate",
  "db.read:finding.confirmed",
  "db.read:finding.merge_candidate",
  "db.read:finding.reviewed",
  "db.write:finding.reviewed",
  "finding.review",
  "framework.console.output",
]
database.actions.view = false
database.actions.write = true
database.actions.manage = false
module = "bywaf.plugins.analysis.finding"
