[plugin]
library_backed = false
process_wrapped = true
service = false

[[commandlets]]
name = "screenshotter"
consumes = [
  "http.endpoint",
]
emits = [
  "eyewitness.screenshot",
  "web.screenshotted_host",
]
capabilities = [
  "artifact.write",
  "db.write:eyewitness.screenshot",
  "db.write:web.screenshotted_host",
  "db.write:tool.error",
  "db.write:system.error",
  "filesystem.read",
  "filesystem.write",
  "framework.console.alert",
  "framework.process.run",
  "network.connect",
  "process.run",
]
module = "bywaf.plugins.http.screenshotter"
