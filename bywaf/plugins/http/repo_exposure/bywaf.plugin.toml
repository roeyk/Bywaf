[plugin]
version = "0.12.2"
native = true
service = false

[[commandlets]]
name = "git_expose_check"
emits = [
  "repo.git_config.checked",
  "finding.candidate",
]
capabilities = [
  "db.write:finding.candidate",
  "framework.console.alert",
  "network.connect",
]
module = "bywaf.plugins.http.repo_exposure"

[[commandlets]]
name = "repo_exposure"
emits = [
  "repo.git_config.checked",
  "finding.candidate",
]
capabilities = [
  "db.write:finding.candidate",
  "framework.console.alert",
  "network.connect",
]
module = "bywaf.plugins.http.repo_exposure"
