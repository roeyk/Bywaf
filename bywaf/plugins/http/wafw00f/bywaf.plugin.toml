[plugin]
version = "0.13.0"
library_backed = false
process_wrapped = true
service = false

[[commandlets]]
name = "waf"
consumes = [
  "http.endpoint",
]
emits = [
  "web.waf.detected",
  "tool.error",
]
capabilities = [
  "artifact.write",
  "db.read:http.endpoint",
  "db.write:process.run",
  "db.write:tool.error",
  "db.write:web.waf.detected",
  "framework.console.alert",
  "framework.process.run",
  "network.connect",
]
module = "bywaf.plugins.http.wafw00f"
database.actions.view = true
database.actions.write = true
database.actions.manage = false
