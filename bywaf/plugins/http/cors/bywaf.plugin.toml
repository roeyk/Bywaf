[plugin]
version = "0.13.0"
native = true
library_backed = false
process_wrapped = false
service = false
roles = ["command-provider"]

[[commandlets]]
name = "http_cors"
description = "Probe HTTP CORS posture and report unsafe cross-origin policy candidates."
usage = "http_cors [options] [target ...]"
examples = [
  "http_cors https://example.test/api",
  "hostscanner 127.0.0.1 | portscanner port=80,443 | http_cors path=/api",
]
consumes = [
  "port.open",
]
emits = [
  "http.cors",
  "finding.candidate",
]
capabilities = [
  "db.write:finding.candidate",
  "db.write:http.cors",
  "network.connect",
]
module = "bywaf.plugins.http.cors"
database.actions.view = false
database.actions.write = true
database.actions.manage = false

[[commandlets.arguments]]
name = "targets"
description = "explicit URLs, hosts, or host:port targets"
nargs = "*"

[[commandlets.options]]
name = "origin"
description = "Origin header value"
type = "str"
default = "https://bywaf-origin-check.invalid"

[[commandlets.options]]
name = "path"
description = "request path"
type = "str"
default = "/"

[[commandlets.options]]
name = "request-method"
description = "CORS requested method"
type = "str"
default = "GET"
choices = ["GET", "POST", "PUT", "DELETE", "PATCH"]

[[commandlets.options]]
name = "scheme"
description = "scheme override"
type = "str"
default = "auto"
choices = ["auto", "http", "https"]

[[commandlets.options]]
name = "timeout"
description = "request timeout seconds"
type = "float"
default = "5"

[[event_schemas]]
topic = "http.cors"
version = "1"
summary = "CORS response posture observed from one HTTP response."
notes = [
  "This is a plugin-owned fact emitted by http_cors; use finding.candidate for reportable CORS issues.",
]

[[event_schemas.fields]]
name = "url"
type = "str"
required = true
description = "HTTP URL that was probed."

[[event_schemas.fields]]
name = "host"
type = "str"
required = true
description = "HTTP target host."

[[event_schemas.fields]]
name = "port"
type = "int"
required = true
description = "HTTP target port."

[[event_schemas.fields]]
name = "scheme"
type = "str"
required = true
description = "HTTP target scheme."

[[event_schemas.fields]]
name = "path"
type = "str"
required = true
description = "Request path used for the CORS probe."

[[event_schemas.fields]]
name = "origin"
type = "str"
required = true
description = "Origin header sent by the probe."

[[event_schemas.fields]]
name = "request_method"
type = "str"
required = true
description = "Access-Control-Request-Method sent by the probe."

[[event_schemas.fields]]
name = "status"
type = "int"
description = "HTTP response status code."

[[event_schemas.fields]]
name = "allow_origin"
type = "str"
description = "Raw Access-Control-Allow-Origin response header."

[[event_schemas.fields]]
name = "allow_credentials"
type = "str"
description = "Raw Access-Control-Allow-Credentials response header."

[[event_schemas.fields]]
name = "allow_methods"
type = "str"
description = "Raw Access-Control-Allow-Methods response header."

[[event_schemas.fields]]
name = "vary"
type = "str"
description = "Raw Vary response header."

[[event_schemas.fields]]
name = "reflected_origin"
type = "bool"
required = true
description = "Whether Access-Control-Allow-Origin matched the synthetic Origin exactly."

[[event_schemas.fields]]
name = "wildcard_origin"
type = "bool"
required = true
description = "Whether Access-Control-Allow-Origin was wildcard."

[[event_schemas.fields]]
name = "credentials_allowed"
type = "bool"
required = true
description = "Whether Access-Control-Allow-Credentials was true."

[[event_schemas.fields]]
name = "error"
type = "str"
description = "Connection or protocol error, if the probe failed."
