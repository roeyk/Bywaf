[plugin]
version = "0.13.0"
library_backed = true
process_wrapped = false
service = false

[[commandlets]]
name = "shodan_lookup"
emits = [
  "shodan.host",
  "shodan.result",
]
capabilities = [
  "db.write:shodan.host",
  "db.write:shodan.result",
  "db.write:tool.error",
  "framework.secret.resolve",
  "network.connect",
]
secret_options = ["api-key"]
module = "bywaf.plugins.recon.shodan_lookup"
