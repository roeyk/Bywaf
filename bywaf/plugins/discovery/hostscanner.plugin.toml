[plugin]
version = "0.1.0"
library_backed = true
process_wrapped = true
service = false

[[commandlets]]
name = "hostscanner"
emits = [
  "host.found",
  "name.resolved",
]
capabilities = [
  "artifact.write",
  "filesystem.read",
  "framework.console.alert",
  "framework.console.output",
  "network.connect",
  "variable.read",
]
module = "bywaf.plugins.discovery.hostscanner"
