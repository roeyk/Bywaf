[plugin]
library_backed = true
process_wrapped = true
service = false

[[commandlets]]
name = "portscanner"
consumes = [
  "host.found",
]
emits = [
  "port.open",
  "finding.candidate",
]
capabilities = [
  "db.write:finding.candidate",
  "db.write:name.resolved",
  "framework.console.alert",
  "framework.console.output",
  "network.connect",
  "plugin.progress",
]
module = "bywaf.plugins.network.portscanner"

[[commandlets]]
name = "ports"
consumes = [
  "port.open",
]
capabilities = [
  "framework.console.output",
  "framework.file.page",
]
database.actions.view = true
database.actions.write = false
database.actions.manage = false
module = "bywaf.plugins.network.portscanner"
