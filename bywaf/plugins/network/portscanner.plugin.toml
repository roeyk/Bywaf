[plugin]
version = "0.12.2"
library_backed = true
process_wrapped = true
service = false

[[commandlets]]
name = "portscanner"
consumes = [
  "host.found",
  "network.route.hop",
]
emits = [
  "port.open",
  "finding.candidate",
  "name.resolved",
  "tool.error",
]
capabilities = [
  "db.read:host.found",
  "db.read:command.run.completed",
  "db.read:command.run.failed",
  "db.write:finding.candidate",
  "db.write:name.resolved",
  "db.write:tool.error",
  "framework.console.alert",
  "framework.console.output",
  "network.connect",
  "variable.read",
  "plugin.progress",
]
module = "bywaf.plugins.network.portscanner"

[[commandlets]]
name = "ports"
consumes = [
  "port.open",
]
capabilities = [
  "framework.console.output",
  "framework.file.page",
]
database.actions.view = true
database.actions.write = false
database.actions.manage = false
module = "bywaf.plugins.network.portscanner"
