[plugin]
version = "0.13.0"
library_backed = true
process_wrapped = false
service = false

[[commandlets]]
name = "ssh_probe"
consumes = [
  "port.open",
]
emits = [
  "ssh.service",
]
capabilities = [
  "db.write:ssh.service",
  "db.write:tool.error",
  "framework.secret.resolve",
  "network.connect",
]
secret_options = ["password"]
module = "bywaf.plugins.network.ssh_probe"
