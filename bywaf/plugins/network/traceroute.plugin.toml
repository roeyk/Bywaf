[plugin]
version = "0.12.2"
process_wrapped = true
service = false

[[commandlets]]
name = "traceroute"
description = "Trace network route hops for explicit targets or host.found input."
usage = "traceroute [binary=traceroute] [maxhops=30] [timeout=5] <target ...>"
examples = [
  "traceroute 192.0.2.10",
  "hostscanner 192.168.50.0/24 | traceroute",
  "traceroute binary=tracepath 192.0.2.10",
]
consumes = [
  "host.found",
]
emits = [
  "network.route.hop",
  "host.found",
]
capabilities = [
  "artifact.write",
  "db.write:host.found",
  "db.write:tool.error",
  "framework.console.alert",
  "framework.console.output",
  "framework.process.run",
]
module = "bywaf.plugins.network.traceroute"

[[commandlets.arguments]]
name = "targets"
description = "hosts or addresses to trace"
nargs = "*"

[[commandlets.options]]
name = "binary"
description = "traceroute executable"
type = "str"
default = "traceroute"
completion = "path"

[[commandlets.options]]
name = "maxhops"
description = "maximum hops"
type = "int"
default = "30"

[[commandlets.options]]
name = "silent"
description = "suppress per-target alerts"
type = "bool"
default = "false"

[[commandlets.options]]
name = "timeout"
description = "per-hop wait time in seconds"
type = "float"
default = "5"
