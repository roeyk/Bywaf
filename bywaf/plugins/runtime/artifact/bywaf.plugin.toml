[plugin]
version = "0.13.0"
native = true
service = false

[[commandlets]]
name = "artifact"
capabilities = [
  "artifact.read",
  "artifact.write",
  "db.read:artifact.attached",
  "filesystem.read",
  "filesystem.write",
  "framework.console.output",
  "framework.file.page",
]
database.actions.view = true
database.actions.write = true
database.actions.manage = false
module = "bywaf.plugins.runtime.artifact"

[[commandlets]]
name = "search"
capabilities = [
  "artifact.read",
  "framework.console.output",
]
database.actions.view = true
database.actions.write = false
database.actions.manage = false
module = "bywaf.plugins.runtime.artifact"
