[plugin]
version = "0.13.0"
native = true
service = false

[[commandlets]]
name = "bundle"
emits = [
  "bundle.created",
  "bundle.item.added",
  "bundle.sealed",
  "bundle.exported",
]
capabilities = [
  "artifact.read",
  "db.read:bundle.created",
  "db.read:bundle.item.added",
  "db.read:bundle.sealed",
  "db.write:bundle.created",
  "db.write:bundle.item.added",
  "db.write:bundle.sealed",
  "db.write:bundle.exported",
  "filesystem.write",
  "framework.console.output",
]
database.actions.view = true
database.actions.write = true
database.actions.manage = false
module = "bywaf.plugins.runtime.bundle"
