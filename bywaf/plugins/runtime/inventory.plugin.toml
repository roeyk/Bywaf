[plugin]
native = true
service = false

[[commandlets]]
name = "hosts"
capabilities = [
  "framework.console.output",
  "framework.file.page",
]
consumes = [
  "host.found",
  "name.resolved",
  "port.open",
  "http.endpoint",
  "service.detected",
  "finding.candidate",
]
database.actions.view = true
database.actions.write = false
database.actions.manage = false
module = "bywaf.plugins.runtime.inventory"

