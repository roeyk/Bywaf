[plugin]
version = "0.12.2"
native = true
service = false

[[commandlets]]
name = "key"
capabilities = [
  "db.write:key.generated",
  "db.write:key.imported",
  "db.write:key.removed",
  "db.write:key.tested",
  "filesystem.read",
  "filesystem.write",
  "framework.console.output",
]
database.actions.view = true
database.actions.write = true
database.actions.manage = false
module = "bywaf.plugins.runtime.key"
