name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dh-python \
            pybuild-plugin-pyproject \
            python3-all \
            python3-build \
            python3-installer \
            python3-prompt-toolkit \
            python3-setuptools \
            rpm \
            twine
          python -m pip install --upgrade build installer setuptools twine

      - name: Build release artifacts
        run: scripts/build_release_packages.sh

      - name: Smoke-test pip artifacts
        run: tests/scripts/smoke_pip_package.sh

      - name: Smoke-test RPM artifacts
        run: tests/scripts/smoke_rpm_package.sh

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          cp dist/bywaf-*.tar.gz release-artifacts/
          cp dist/bywaf-*.whl release-artifacts/
          cp dist/deb/bywaf_* release-artifacts/
          cp dist/rpm/rpmbuild/RPMS/noarch/bywaf-*.rpm release-artifacts/
          cp dist/rpm/rpmbuild/SRPMS/bywaf-*.rpm release-artifacts/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bywaf-release-artifacts
          path: release-artifacts/*

      - name: Attach artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
