name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test and analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[reporting]"
          python -m pip install bandit coverage pip-audit pyright ruff

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=0
          python -m coverage xml
          python -m coverage html

      - name: Ruff
        run: ruff check .

      - name: Pyright
        run: pyright

      - name: Bandit
        run: bandit -r bywaf -ll

      - name: pip-audit
        run: pip-audit .

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
