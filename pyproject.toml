[project]
name = "bywaf"
version = "0.9.0"
description = "Python 3 commandlet framework with SQLite pub/sub for Bywaf-style workflows."
requires-python = ">=3.11"
dependencies = ["prompt_toolkit>=3.0"]

[project.optional-dependencies]
sqlcipher = ["sqlcipher3-binary>=0.6.0"]
reporting = ["openpyxl>=3.1", "python-docx>=1.1"]

[project.scripts]
bywaf = "bywaf.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bywaf*"]

[tool.setuptools.package-data]
"bywaf.plugins" = ["plugins.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
