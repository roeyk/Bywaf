[project]
name = "bywaf"
version = "0.11.0"
description = "Highly-auditable Python 3 commandlet framework with SQLite pub/sub for Bywaf-style workflows."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Roey Katz", email = "roey.katz@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["prompt_toolkit>=3.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
sqlcipher = ["sqlcipher3-binary>=0.6.0"]
signing = ["cryptography>=42"]
reporting = ["openpyxl>=3.1", "python-docx>=1.1"]
plugins = [
    "dnspython>=2.6",
    "impacket>=0.12",
    "ldap3>=2.9",
    "paramiko>=3.4",
    "pysnmp>=4.4",
    "shodan>=1.31",
    "yara-python>=4.5",
]

[project.scripts]
bywaf = "bywaf.__main__:main"
bywaf-plugin-manifest = "bywaf.tools.plugin_manifest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bywaf*"]

[tool.setuptools.package-data]
"bywaf.keys" = ["*.pem", "*.pub.pem", "*.example", "README.md"]
"bywaf.plugins" = ["plugins.toml", "plugins.json"]
"bywaf.plugins.analysis" = ["*.plugin.toml"]
"bywaf.plugins.discovery" = ["*.plugin.toml"]
"bywaf.plugins.http" = ["*.plugin.toml"]
"bywaf.plugins.identity" = ["*.plugin.toml"]
"bywaf.plugins.network" = ["*.plugin.toml"]
"bywaf.plugins.os" = ["*.plugin.toml"]
"bywaf.plugins.recon" = ["*.plugin.toml"]
"bywaf.plugins.runtime" = ["*.plugin.toml"]
"bywaf.plugins.storage" = ["*.plugin.toml"]
"bywaf.plugins.wireless" = ["*.plugin.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["bywaf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
