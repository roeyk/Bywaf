[project]
name = "bywaf"
version = "0.1.0"
description = "Python 3 commandlet framework with SQLite pub/sub for Bywaf-style workflows."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bywaf = "bywaf.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bywaf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
